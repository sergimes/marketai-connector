# MarketAI Connector.
#
# Your bots are in compose.override.yml, which the setup writes (./setup.sh, or
# setup.cmd on Windows). Docker reads both files together:
#
#   docker compose up -d --remove-orphans      start, or apply the setup's changes
#   docker compose logs -f                     watch every bot
#   docker compose stop                        stop everything
#
# The setup can do all three for you.
#
# Do not edit this file: `git pull` updates it. Everything that is yours lives in files
# git ignores (compose.override.yml, bot-*.env, .env), so an update never touches them.
name: marketai-connector

services:
  # Checks for a new release at minute 7, 22, 37 and 52 of every hour, and if there is
  # one, pulls it and restarts the bots. Those minutes are the middle of each 15-minute
  # bar, when no order is normally being placed. It is set to update only the containers
  # labelled for it: the bots. The setup can turn it off.
  updater:
    image: nickfedor/watchtower:1.22.3
    restart: unless-stopped
    volumes:
      # How it restarts the bots. It is told to touch only containers labelled for it.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCHEDULE: "0 7,22,37,52 * * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: UTC
