# MarketAI Connector: runs your MarketAI bots on your own exchange accounts.
#
#   cp bot.example.env bot1.env     # then fill in bot1.env
#   docker compose up -d            # start
#   docker compose logs -f bot1     # watch it
#   docker compose down             # stop
#
# One bot = one settings file (bot1.env, bot2.env, ...) = one block under `services`.
# See README.md, "More than one bot".
name: marketai-connector

# What every bot shares. Each bot below adds only its own settings file and storage.
x-bot: &bot
  image: ghcr.io/sergimes/marketai-connector:latest
  # To stay on one version instead of updating, name it here, e.g.
  # image: ghcr.io/sergimes/marketai-connector:1.0.0
  # Keeps it running after a crash or a reboot. It never exits on purpose: a paused
  # bot, a refused token or a lost connection all leave it running and waiting.
  restart: unless-stopped
  labels:
    # Lets the updater below refresh the bots, and nothing else.
    - com.centurylinklabs.watchtower.enable=true
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  bot1:
    <<: *bot
    env_file: bot1.env
    volumes:
      # This bot's saved state (the stop-loss and take-profit of each open position)
      # and its log files. Its own, so no other bot can touch them.
      - bot1-data:/app/orders
      - bot1-logs:/app/logs

  # A second bot: create bot2.env (README, "More than one bot"), then delete the # at
  # the very start of the six lines below, and of the two bot2 lines at the bottom.
#  bot2:
#    <<: *bot
#    env_file: bot2.env
#    volumes:
#      - bot2-data:/app/orders
#      - bot2-logs:/app/logs

  # Checks for a new release at minute 7, 22, 37 and 52 of every hour, and if there is
  # one, pulls it and restarts the bots. Those minutes are the middle of each 15-minute
  # bar, so an update never cuts an order short. Remove this service to update by hand
  # instead: `docker compose pull && docker compose up -d`.
  updater:
    image: nickfedor/watchtower:1.22.3
    restart: unless-stopped
    volumes:
      # How it restarts the bots. It is told to touch only the labelled containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCHEDULE: "0 7,22,37,52 * * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: UTC

volumes:
  bot1-data:
  bot1-logs:
#  bot2-data:
#  bot2-logs:
