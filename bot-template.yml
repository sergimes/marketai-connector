# What every bot shares. Each bot in compose.override.yml extends this one.
#
# Do not edit this file: `git pull` updates it. To stay on one version instead of
# updating, create a file named .env in this folder holding one line, for example:
#   CONNECTOR_VERSION=0.3.0
services:
  bot:
    image: ghcr.io/sergimes/marketai-connector:${CONNECTOR_VERSION:-latest}
    # Keeps a bot running after a crash or a reboot. It never exits on purpose: a paused
    # bot, a refused token or a lost connection all leave it running and waiting.
    restart: unless-stopped
    labels:
      # Lets the updater in compose.yml refresh the bots, and nothing else.
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
